[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "timescope"
version = "0.1.0"
description = "TimesFM Financial Forecast Research Lab"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "duckdb>=0.9.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "numpy>=1.22.0",
    "yfinance>=0.2.31",
    "click>=8.0.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "xgboost>=2.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
]

[project.scripts]
timescope = "app.cli:cli"
